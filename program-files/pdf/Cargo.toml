[package]
name = "nucleus-pdf"
version = "0.0.0"
description = "Provider of the Nucleus `pdf` interface: extracts text from PDFs in a confined directory."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cap-std = "4"
nucleus-pdf-interface.workspace = true
nucleus-protocol.workspace = true
nucleus-sdk.workspace = true
pdf-extract = "0.12"
# `openat2` beneath the root, refusing any symbolic link in the path.
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
