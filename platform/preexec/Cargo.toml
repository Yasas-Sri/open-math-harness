[package]
name = "nucleus-preexec"
version = "0.0.0"
description = "The Linux pre_exec hooks (a program's lifetime bound to its supervisor, its cgroup, inherited descriptors) and the reaper that ends everything a command started when it ends."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = "0.2"
rustix = { version = "1", features = ["process"] }

# No `[lints] workspace = true`: this crate exists to hold the `unsafe`
# these hooks need (`CommandExt::pre_exec`), which the workspace forbids
# everywhere else.
[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
