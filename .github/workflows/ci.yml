name: ci

# Checks every pull request and every push to main. This repository has no deployment: Open
# Math OS keeps it in its `harness/` folder and builds, packages and deploys the VM runtime
# from there.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted runners only: a pull request's code never runs on a machine of ours.
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Runtime services use bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu 24.04 restricts them through AppArmor unless this is off.
      - name: Install bubblewrap and allow user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # rust-toolchain.toml pins the version and components; rustup installs them.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every program in target/debug: the Node tests below start them from there.
      - run: cargo build --locked --workspace
      - run: cargo test --workspace
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: python3 tools/check_markdown.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: node --test tests/mcp/mcp.test.js
